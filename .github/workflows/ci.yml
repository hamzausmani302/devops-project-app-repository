name: Continious integration
on:
  push: 


jobs:
  detect-changes:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # fetch all commits
    - run: |
        changed=$(git diff --name-only HEAD~1 HEAD)
        for file in $changed_files; do
          echo "Changed file: $file"
        done
        echo $changed
  
