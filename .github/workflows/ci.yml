name: Continious integration
on:
  push: 


jobs:
  detect-changes:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # fetch all commits
    - run: |
        output_file="changed.txt"
        echo "" > $output_file
        git diff --name-only HEAD~1 HEAD | while IFS= read -r file; do
            if [[ "$file" == *.ver ]]; then
                echo "Changed file: $file"
                service_name=$(echo "$file" | cut -d'/' -f1)
                echo $service_name >> $output_file
            fi    
        done
        cat $ouptut_file
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4.0.0
      with:
        # Artifact name
        name: changed  # optional, default is artifact
        # A file, directory or wildcard pattern that describes what to upload
        path: changed.txt
  push-services:
    runs-on: ubuntu-latest
    needs: detect-changes
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # fetch all commits

    - name: download changed files
      uses: actions/download-artifact@v4.0.0
      with:
        # Name of the artifact to download. If unspecified, all artifacts for the run are downloaded.
        name: changed # optional
        # Destination path. Supports basic tilde expansion. Defaults to $GITHUB_WORKSPACE
        path: artifacts # optional
    - run: |
        ls artifacts
        mkdir images
        while IFS= read -r line; do
            if [[ $line != "" ]]; then
              ver=$(cat $line/.ver)
              TAG_NAME=$ver
              echo "Changed services: $line"
              echo "Building service: $line"
              docker build -t $TAG_NAME $line/
              docker save -o images/$line-$TAG_NAME.tar $TAG_NAME
              git tag $line/$TAG_NAME
              git push origin $line/$TAG_NAME
            fi
        done < artifacts/changed.txt
        ls images
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
       username: ${{ secrets.DOCKER_HUB_USERNAME }}
       password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    - name: Upload Images
      uses: actions/upload-artifact@v4.0.0
      with:
        # Artifact name
        name: images  # optional, default is artifact
        # A file, directory or wildcard pattern that describes what to upload
        path: images

        
