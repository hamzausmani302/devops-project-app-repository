<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalog Service</title>
    <script src="./env.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 40px 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        color: white;
        margin-bottom: 50px;
      }

      header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      }

      header p {
        font-size: 1rem;
        opacity: 0.9;
      }

      .loading {
        text-align: center;
        color: white;
        font-size: 1.2rem;
      }

      .error {
        background-color: #f8d7da;
        color: #721c24;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        border-left: 4px solid #f5c6cb;
      }

      #products {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 25px;
        animation: fadeIn 0.5s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .product-item {
        background: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
        cursor: pointer;
        overflow: hidden;
      }

      .product-item::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      }

      .product-item:hover {
        transform: translateY(-10px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      .product-item h3 {
        color: #333;
        font-size: 1.5rem;
        margin-bottom: 10px;
        word-break: break-word;
      }

      .product-item .price {
        color: #667eea;
        font-size: 1.8rem;
        font-weight: bold;
        margin: 15px 0;
      }

      .product-item p {
        color: #666;
        line-height: 1.6;
        font-size: 0.95rem;
      }

      .empty-state {
        text-align: center;
        color: white;
        padding: 60px 20px;
      }

      .empty-state h2 {
        font-size: 2rem;
        margin-bottom: 10px;
      }

      @media (max-width: 768px) {
        header h1 {
          font-size: 1.8rem;
        }

        #products {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>📦 Product Catalog</h1>
        <p>Browse our amazing collection of products</p>
      </header>
      <div id="products" class="loading">Loading products...</div>
    </div>
    <script src="./js/index.js"></script>
  </body>
</html>
