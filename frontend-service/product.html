<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product</title>
    <script src="./env.js"></script>

    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #222;
        padding: 24px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .price {
        color: #667eea;
        font-weight: 700;
        font-size: 1.6rem;
      }
      .generate-btn {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        padding: 12px 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      .back-link {
        color: #667eea;
        text-decoration: none;
      }
      .message {
        margin-top: 12px;
        padding: 10px;
        border-radius: 8px;
        display: none;
      }
      .message.success {
        background: #d4edda;
        color: #155724;
      }
      .message.error {
        background: #f8d7da;
        color: #721c24;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="top">
        <div>
          <a class="back-link" href="./index.html">← Back to catalog</a>
        </div>
        <div id="userInfo"></div>
      </div>

      <h1 id="productName">Loading…</h1>
      <div class="price" id="productPrice"></div>
      <p id="productDesc"></p>

      <div
        style="margin-top: 18px; display: flex; gap: 12px; align-items: center"
      >
        <label
          >Quantity:
          <input
            type="number"
            id="qty"
            value="1"
            min="1"
            style="
              width: 80px;
              padding: 6px;
              border-radius: 6px;
              border: 1px solid #ddd;
              margin-left: 8px;
            "
        /></label>
        <button id="generateBtn" class="generate-btn">Generate</button>
      </div>

      <div id="message" class="message"></div>
    </div>
    <script src="./js/product.js"></script>
  </body>
</html>
